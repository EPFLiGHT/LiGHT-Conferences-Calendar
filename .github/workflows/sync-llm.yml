name: Sync health deadlines from venue websites

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/sync-pr.yml
    with:
      script: sync:llm
      branch: auto/sync-llm
      add-paths: |
        public/data/conferences.yaml
        scripts/sync-llm/venues.json
      title: "chore(data): sync health deadlines from venue websites"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
