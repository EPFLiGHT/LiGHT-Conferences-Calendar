name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Validate YAML data
        run: pnpm validate
      - name: Generate Next.js types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm build
