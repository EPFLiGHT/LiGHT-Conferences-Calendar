name: Sync deadlines from OpenReview

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/sync-pr.yml
    with:
      script: sync:openreview
      branch: auto/sync-openreview
      add-paths: public/data/conferences.yaml
      title: "chore(data): sync deadlines from OpenReview"
