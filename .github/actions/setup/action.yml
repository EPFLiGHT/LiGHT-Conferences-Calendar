name: Setup
description: Install pnpm and Node 22 with the pnpm store cached, then install dependencies.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install
